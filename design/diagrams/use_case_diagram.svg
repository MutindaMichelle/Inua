  <text x="500" y="305" font-size="9.5" font-style="italic" fill="#5B6472">&#171;include&#187;</text>

  <line x1="660" y1="265" x2="605" y2="320" stroke="#5B6472" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="655" y="300" font-size="9.5" font-style="italic" fill="#5B6472">&#171;include&#187;</text>

  <line x1="530" y1="370" x2="470" y2="415" stroke="#5B6472" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="435" y="400" font-size="9.5" font-style="italic" fill="#5B6472">&#171;include&#187;</text>

  <line x1="640" y1="368" x2="695" y2="415" stroke="#5B6472" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="655" y="400" font-size="9.5" font-style="italic" fill="#5B6472">&#171;include&#187;</text>

  <line x1="710" y1="468" x2="600" y2="590" stroke="#5B6472" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="660" y="535" font-size="9.5" font-style="italic" fill="#5B6472">&#171;include&#187;</text>

