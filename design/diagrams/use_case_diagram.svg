  </defs>
  <rect x="0" y="0" width="1150" height="800" fill="#FFFFFF"/>
  <text x="575" y="32" font-size="15" font-weight="bold" fill="#1B2A4A" text-anchor="middle">CAREER MENTORSHIP PREDICTION SYSTEM</text>

  <rect x="255" y="55" width="650" height="700" fill="none" stroke="#1B2A4A" stroke-width="1.6"/>

